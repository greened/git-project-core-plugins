[build-system]
requires = ["hatchling", "hatch-requirements-txt", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build.hooks.vcs]
version-file = "_version.py"

[project]
name = "git-project-core-plugins"
dynamic = ["dependencies", "readme", "version"]
description = "The extensible stupid project manager - core functionality"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
    { name = "David A. Greene", email = "dag@obbligato.org" },
]
keywords = [
    "development",
    "git",
    "project",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-console-scripts",
    "git-project",
]

[project.urls]
Documentation = "https://github.com/greened/git-project-core-plugins#readme"
Issues = "https://github.com/greened/git-project-core-plugins/issues"
Source = "https://github.com/greened/git-project-core-plugins"

[project.entry-points."git-project.plugins"]
artifact = "git_project_core_plugins.artifact:ArtifactPlugin"
branch = "git_project_core_plugins.branch:BranchPlugin"
run = "git_project_core_plugins.run:RunPlugin"
clone = "git_project_core_plugins.clone:ClonePlugin"
config = "git_project_core_plugins.config:ConfigPlugin"
help = "git_project_core_plugins.help:HelpPlugin"
init = "git_project_core_plugins.init:InitPlugin"
worktree = "git_project_core_plugins.worktree:WorktreePlugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.envs.default]
dependencies = [
  "coverage[toml]>=6.5",
  "pytest",
  "pytest-console-scripts",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = [
  "- coverage combine",
  "coverage report",
]
cov = [
  "test-cov",
  "cov-report",
]

[[tool.hatch.envs.all.matrix]]
python = ["3.10", "3.11"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]
[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive {args:src/git_project_core_plugins tests}"
style = [
  "ruff {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff --fix {args:.}",
  "style",
]
all = [
  "style",
  "typing",
]

[tool.hatch.envs.docs]
# NOT detached: autodoc imports the package, because docs/intro.rst pulls the
# module docstring in with automodule rather than keeping a second copy. A
# detached env would build with the package absent and the directive would fail.
dependencies = [
  "sphinx>=7",
]
[tool.hatch.envs.docs.scripts]
build = "sphinx-build -M html docs docs/_build"
clean = "sphinx-build -M clean docs docs/_build"

[tool.black]
target-version = ["py310"]
line-length = 120
skip-string-normalization = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["git-project-core-plugins"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.coverage.run]
source_pkgs = ["git-project-core-plugins", "tests"]
branch = true
parallel = true
omit = [
  "src/git_project_core_plugins/__about__.py",
]

[tool.coverage.paths]
git-project-core-plugins = [
  "src/git_project_core_plugins",
  "*/git-project-core-plugins/src/git_project_core_plugins"
]
tests = ["tests", "*/git-project-core-plugins/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.metadata.hooks.vcs]
Homepage = "https://github.com/greened/git-project-core-plugins#readme"
source_archive = "https://github.com/greened/git-project-core-plugins/archive/{commit_hash}.zip"

# The long description is assembled by hatch_build.py, which appends the
# command reference generated from the plugin classes. hatch-fancy-pypi-readme
# cannot do that: it concatenates files and text, and the reference is neither.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.metadata.hooks.requirements_txt]
files = ["requirements.txt"]

[tool.hatch.build.targets.wheel]
packages = [
    "/src/git_project_core_plugins",
]
